name: feature-pipeline
on: [push]
permissions:
    contents: read
    statuses: write
    security-events: read

jobs: 
  feature-pipeline:
    if: github.ref != 'refs/heads/main'
    uses: devops-cloud-shop/reusable-workflows/.github/workflows/nodeJS-feature-pipeline.yaml@main
    with:
      project: roboshop
      component: catalogue
      environment: dev
    secrets: inherit