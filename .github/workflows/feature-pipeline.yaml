name: feature-pipeline
on: [push]
permissions:
    contents: read
    statuses: write
    security-events: read
jobs: 
  feature-pipeline:
    if: github.ref != 'refs/heads/main'
    uses: devops-cloud-shop/reusable-workflows/.github/workflows/nodeJS-feature-pipeline.yaml@main
    with:
      project: roboshop
      component: catalogue
      environment: dev
    secrets: inherit
#if commit is made to main branch, dev-pipeline is triggered
  dev-pipeline:
    if: github.ref == 'refs/heads/main'
    uses: devops-cloud-shop/reusable-workflows/.github/workflows/DEV-nodeJS-pipeline.yaml@main
    with:
      project: roboshop
      component: catalogue
      environment: dev
    secrets: inherit